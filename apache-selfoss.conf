# Railway wrapper for selfoss.
ServerName localhost
ServerTokens Prod
ServerSignature Off

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 "%{X-Forwarded-For}i %h %t \"%r\" %>s %b %D"
    # Railway terminates TLS: tell selfoss the public scheme and port so its
    # base URL is https://host/ (not http://host:8080/) and session cookies are Secure.
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
    RequestHeader set X-Forwarded-Port "443" "expr=%{HTTP:X-Forwarded-Proto} == 'https'"
</VirtualHost>

<Directory /var/www/html>
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Never serve the database, logs, cache or sessions, even if a rewrite rule changes.
<DirectoryMatch "^/var/www/html/data/(sqlite|logs|cache|sessions|fulltextrss)">
    Require all denied
</DirectoryMatch>
<FilesMatch "\.(ini|db|sqlite|log)$">
    Require all denied
</FilesMatch>
